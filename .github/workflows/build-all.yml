name: Build Grey vless (all platforms)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download sing-box cores
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip curl
          chmod +x scripts/download-cores.sh
          ./scripts/download-cores.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin/

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev python3-pil
          chmod +x scripts/prepare-icons.sh
          ./scripts/prepare-icons.sh
          cd grey_vless
          flutter create . --org com.grey --project-name grey_vless --platforms=linux
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-linux-x64
          path: grey_vless/build/linux/x64/release/bundle/

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - shell: pwsh
        run: |
          pip install pillow --quiet
          bash scripts/prepare-icons.sh
          Set-Location grey_vless
          flutter create . --org com.grey --project-name grey_vless --platforms=windows
          flutter pub get
          dart run flutter_launcher_icons
          flutter build windows --release
          Set-Location ..
          pwsh scripts/pack-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-windows-x64
          path: dist/Grey-vless-windows-x64.zip

  macos-arm64:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          cd grey_vless
          flutter create . --org com.grey --project-name grey_vless --platforms=macos
          chmod +x ../scripts/build-macos.sh
          ../scripts/build-macos.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-macos-arm64
          path: grey_vless/dist/Grey-vless-macos-arm64.dmg

  macos-intel:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          cd grey_vless
          flutter create . --org com.grey --project-name grey_vless --platforms=macos
          chmod +x ../scripts/build-macos.sh
          ../scripts/build-macos.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-macos-intel
          path: grey_vless/dist/Grey-vless-macos-x86_64.dmg

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          chmod +x scripts/prepare-icons.sh scripts/build-hev-android.sh
          ./scripts/prepare-icons.sh
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./scripts/build-hev-android.sh
          cd grey_vless
          flutter create . --org com.grey --project-name grey_vless --platforms=android
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/Grey-vless-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-android-apk
          path: dist/Grey-vless-android.apk

  appimage:
    needs: linux
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grey-vless-linux-x64
          path: bundle
      - run: |
          sudo apt-get update && sudo apt-get install -y fuse libfuse2
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp -r bundle/* AppDir/usr/bin/
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/grey_vless" "$@"
          EOF
          chmod +x AppDir/AppRun
          cp data/grey-vless.png AppDir/grey-vless.png 2>/dev/null || true
          ARCH=x86_64 ./appimagetool AppDir Grey-vless-flutter-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-appimage
          path: Grey-vless-flutter-x86_64.AppImage

  release:
    needs: [linux, windows, macos-arm64, macos-intel, android, appimage]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare release files
        id: prep
        run: |
          mkdir -p dist
          VERSION=$(grep '^version:' grey_vless/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp release-assets/grey-vless-android-apk/Grey-vless-android.apk dist/ 2>/dev/null || \
            cp release-assets/grey-vless-android-apk/app-release.apk dist/Grey-vless-android.apk 2>/dev/null || true
          cp release-assets/grey-vless-windows-x64/Grey-vless-windows-x64.zip dist/ 2>/dev/null || true
          cp release-assets/grey-vless-macos-arm64/Grey-vless-macos-arm64.dmg dist/ 2>/dev/null || true
          cp release-assets/grey-vless-macos-intel/Grey-vless-macos-x86_64.dmg dist/ 2>/dev/null || true
          cp release-assets/grey-vless-appimage/Grey-vless-flutter-x86_64.AppImage dist/ 2>/dev/null || true
          cd release-assets/grey-vless-linux-x64 && zip -qr ../../dist/Grey-vless-linux-x64.zip .
          ls -la dist/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}-build.${{ github.run_number }}
          name: Grey vless v${{ steps.prep.outputs.version }}
          body: |
            ## Скачать (доступно всем)

            | Платформа | Файл |
            |-----------|------|
            | Android | Grey-vless-android.apk |
            | Windows | Grey-vless-windows-x64.zip → запустить **grey_vless.exe** |
            | macOS Apple Silicon (M1/M2/M3) | Grey-vless-macos-arm64.dmg |
            | macOS Intel (Monterey 12 и новее) | Grey-vless-macos-x86_64.dmg |
            | Linux Flutter | Grey-vless-linux-x64.zip |
            | Linux AppImage | Grey-vless-flutter-x86_64.AppImage |

            **macOS:** на старом Intel Mac (Monterey) нужен файл **x86_64**, не arm64.

            **Windows:** в архиве один exe — `grey_vless.exe`. Если был другой прокси, приложение его временно заменит и вернёт при отключении.
          files: dist/*
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
