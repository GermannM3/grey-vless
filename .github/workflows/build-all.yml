name: Build Grey vless (all platforms)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download sing-box cores
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip curl
          chmod +x scripts/download-cores.sh
          ./scripts/download-cores.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin/

  deb:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grey-vless-linux-x64
          path: bundle
      - name: Build .deb (Flutter)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          chmod +x scripts/build-flutter-deb.sh
          ./scripts/build-flutter-deb.sh bundle
          VERSION=$(grep '^version:' grey_vless/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mkdir -p dist
          cp "build/deb/grey-vless_${VERSION}_amd64.deb" "dist/grey-vless_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-deb
          path: dist/grey-vless_*.deb

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev python3-pil
          chmod +x scripts/prepare-icons.sh
          ./scripts/prepare-icons.sh
          cd grey_vless
          flutter create . --org com.grey --project-name grey_vless --platforms=linux
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-linux-x64
          path: grey_vless/build/linux/x64/release/bundle/

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - shell: pwsh
        run: |
          pip install pillow --quiet
          bash scripts/prepare-icons.sh
          Set-Location grey_vless
          flutter create . --org com.grey --project-name grey_vless --platforms=windows
          flutter pub get
          dart run flutter_launcher_icons
          flutter build windows --release
          Set-Location ..
          pwsh scripts/pack-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-windows-x64
          path: dist/Grey-vless-windows-x64.zip

  macos-arm64:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          cd grey_vless
          flutter create . --org com.grey --project-name grey_vless --platforms=macos
          chmod +x ../scripts/build-macos.sh ../scripts/prepare-icons.sh ../scripts/patch-macos.sh
          ../scripts/build-macos.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-macos-arm64
          path: grey_vless/dist/Grey-vless-macos-arm64.dmg

  macos-intel:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          cd grey_vless
          flutter create . --org com.grey --project-name grey_vless --platforms=macos
          chmod +x ../scripts/build-macos.sh ../scripts/prepare-icons.sh ../scripts/patch-macos.sh
          ../scripts/build-macos.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-macos-intel
          path: grey_vless/dist/Grey-vless-macos-x86_64.dmg

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-cores
          path: grey_vless/assets/bin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: chmod +x scripts/prepare-icons.sh scripts/build-hev-android.sh
      - run: ./scripts/prepare-icons.sh
      - name: Restore release keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: grey_vless/android/keystore/grey-vless-release.jks
          key: grey-vless-release-keystore-v1
      - name: Generate release keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p grey_vless/android/keystore
          keytool -genkey -v \
            -keystore grey_vless/android/keystore/grey-vless-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias grey-vless \
            -storepass GreyVlessReleaseKey \
            -keypass GreyVlessReleaseKey \
            -dname "CN=Grey vless, OU=Mobile, O=GermannM3, C=RU"
      - name: Create key.properties
        run: |
          cat > grey_vless/android/key.properties <<'EOF'
          storePassword=GreyVlessReleaseKey
          keyPassword=GreyVlessReleaseKey
          keyAlias=grey-vless
          storeFile=../keystore/grey-vless-release.jks
          EOF
      - name: Bundle sing-box for Android (jniLibs)
        run: |
          chmod +x scripts/bundle-singbox-android.sh
          ./scripts/bundle-singbox-android.sh
      - name: Build hev native lib
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./scripts/build-hev-android.sh
      - name: Build Android APK
        run: |
          cd grey_vless
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --android-skip-build-dependency-validation
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/Grey-vless-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-android-apk
          path: dist/Grey-vless-android.apk

  appimage:
    needs: linux
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grey-vless-linux-x64
          path: bundle
      - run: |
          pip3 install pillow --quiet 2>/dev/null || true
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp -r bundle/* AppDir/usr/bin/
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/grey_vless" "$@"
          EOF
          chmod +x AppDir/AppRun
          cp data/grey-vless.png AppDir/grey-vless.png 2>/dev/null || true
          ARCH=x86_64 ./appimagetool AppDir Grey-vless-flutter-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: grey-vless-appimage
          path: Grey-vless-flutter-x86_64.AppImage

  release:
    needs: [linux, windows, macos-arm64, macos-intel, android, appimage, deb]
    if: always() && !cancelled() && needs.android.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare release files
        id: prep
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST"
          VERSION=$(grep '^version:' grey_vless/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          BUILD=$(grep '^version:' grey_vless/pubspec.yaml | awk '{print $2}' | cut -d+ -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

          cp release-assets/grey-vless-android-apk/Grey-vless-android.apk "$DIST/" 2>/dev/null || \
            cp release-assets/grey-vless-android-apk/app-release.apk "$DIST/Grey-vless-android.apk" 2>/dev/null || true
          cp release-assets/grey-vless-windows-x64/Grey-vless-windows-x64.zip "$DIST/" 2>/dev/null || true
          cp release-assets/grey-vless-macos-arm64/Grey-vless-macos-arm64.dmg "$DIST/" 2>/dev/null || true
          cp release-assets/grey-vless-macos-intel/Grey-vless-macos-x86_64.dmg "$DIST/" 2>/dev/null || true
          cp release-assets/grey-vless-appimage/Grey-vless-flutter-x86_64.AppImage "$DIST/" 2>/dev/null || true
          cp release-assets/grey-vless-deb/grey-vless_*.deb "$DIST/" 2>/dev/null || true

          if [[ -d release-assets/grey-vless-linux-x64 ]]; then
            (cd release-assets/grey-vless-linux-x64 && zip -qr "$DIST/Grey-vless-linux-x64.zip" .)
          fi

          ls -la "$DIST/"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}-build.${{ steps.prep.outputs.build }}
          name: Grey vless v${{ steps.prep.outputs.version }} (build ${{ steps.prep.outputs.build }})
          body: |
            ## Скачать (доступно всем)

            | Платформа | Файл |
            |-----------|------|
            | Android | Grey-vless-android.apk |
            | Windows | Grey-vless-windows-x64.zip → **grey_vless.exe** |
            | macOS Apple Silicon | Grey-vless-macos-arm64.dmg |
            | macOS Intel (Monterey 12+) | Grey-vless-macos-x86_64.dmg |
            | Linux Flutter | Grey-vless-linux-x64.zip — **основной десктоп** |
            | Linux AppImage | Grey-vless-flutter-x86_64.AppImage (если есть) |
            | Linux .deb | grey-vless_*_amd64.deb — Flutter, тот же UI что Android |

            **Windows:** при первом запуске из Downloads приложение само ставится в `%LOCALAPPDATA%\Programs\Grey-vless` и снимает блокировку «из Интернета». Дальше — только из меню Пуск / Запуск.cmd. TUN = UAC.

            **Android:** VPN не усыпляется при выключенном экране (wake lock + запрос исключения из оптимизации батареи). Режим туннеля: полный / только выбранные приложения / все кроме выбранных / без TUN.

            **ПК:** режим «только выбранные приложения» — через TUN + правила sing-box `process_name` (нужен UAC). Выберите exe в списке из меню Пуск.

            **Автообновление:** приложение само проверяет GitHub Releases.
          files: dist/*
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
