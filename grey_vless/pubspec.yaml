name: grey_vless
description: Grey vless — cross-platform VPN client
publish_to: "none"
version: 0.4.5+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.0
  window_manager: ^0.4.3
  tray_manager: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/grey-vless.png
    - assets/bin/sing-box-linux-amd64
    - assets/bin/sing-box-windows-amd64.exe
    - assets/bin/sing-box-darwin-amd64
    - assets/bin/sing-box-darwin-arm64
    - assets/bin/sing-box-android-arm64
